name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose version

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null \
              && curl -sf http://localhost:8081/api/movies/health >/dev/null \
              && curl -sf http://localhost:8082/api/events/health >/dev/null \
              && curl -sf http://localhost:8000/health >/dev/null; then
              echo "All services are healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          docker compose ps
          docker compose logs --no-color | tail -200
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Run API tests
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker build -t cinemaabyss-api-tests .
          docker run --rm \
            --network=cinemaabyss-network \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests

      - name: Stop services
        if: always()
        run: docker compose down -v
